<!DOCTYPE html>
<meta charset="utf-8">
<title>overlay prep</title>
<body style="background:#111;color:#ddd;font:12px monospace">
<pre id="log">working…</pre>
<script>
/*
 * Turns a raw in-game pause-map screenshot into a georeferenceable overlay.
 *
 * The capture is the whole game window: the map is drawn semi-transparently
 * over the world, so the snow, scenery and the player all bleed through around
 * and behind it. Two jobs here:
 *
 *   1. Isolate the map. The landmass is one big dark region; everything outside
 *      it is the game. Threshold to dark, keep the largest connected blob, then
 *      fill its interior holes so the white roads, labels and blips drawn on
 *      top of the land come back. That mask becomes the alpha channel.
 *
 *   2. Measure the scale bar, which gives world units per pixel and therefore
 *      the overlay's true size — half of the georeferencing solved for free.
 *
 * Driven by scripts/prep-overlay.mjs, which writes the result to disk.
 */
const SRC = new URL(location.href).searchParams.get('src') || './roxwood.png';
const FEET_LABEL = 3222;                       // the bar reads "3222ft"
const METRES = FEET_LABEL * 0.3048;            // world units are metres

const log = (s) => { document.getElementById('log').textContent += '\n' + s; };

const img = new Image();
img.onload = () => { try { run(); } catch (e) { report({ error: e.message }); } };
img.onerror = () => report({ error: 'could not load ' + SRC });
img.src = SRC;

function report(o) { window.__result = o; document.getElementById('log').textContent = JSON.stringify(o).slice(0, 400); }

function run() {
  const W = img.naturalWidth, H = img.naturalHeight;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);
  const px = ctx.getImageData(0, 0, W, H);
  const d = px.data;

  const lum = new Uint8Array(W * H);
  for (let i = 0, p = 0; i < d.length; i += 4, p++) {
    lum[p] = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) | 0;
  }

  /* ---- 1a. dark mask, largest connected component ---- */
  const DARK = 78;
  const mask = new Uint8Array(W * H);
  for (let p = 0; p < mask.length; p++) mask[p] = lum[p] < DARK ? 1 : 0;

  const label = new Int32Array(W * H).fill(-1);
  const stack = new Int32Array(W * H);
  let best = -1, bestSize = 0, current = 0;
  for (let start = 0; start < mask.length; start++) {
    if (!mask[start] || label[start] !== -1) continue;
    let sp = 0, size = 0;
    stack[sp++] = start;
    label[start] = current;
    while (sp) {
      const p = stack[--sp];
      size++;
      const x = p % W, y = (p / W) | 0;
      if (x > 0     && mask[p - 1] && label[p - 1] === -1) { label[p - 1] = current; stack[sp++] = p - 1; }
      if (x < W - 1 && mask[p + 1] && label[p + 1] === -1) { label[p + 1] = current; stack[sp++] = p + 1; }
      if (y > 0     && mask[p - W] && label[p - W] === -1) { label[p - W] = current; stack[sp++] = p - W; }
      if (y < H - 1 && mask[p + W] && label[p + W] === -1) { label[p + W] = current; stack[sp++] = p + W; }
    }
    if (size > bestSize) { bestSize = size; best = current; }
    current++;
  }
  log(`largest dark blob: ${bestSize} px of ${W * H}`);

  const land = new Uint8Array(W * H);
  for (let p = 0; p < land.length; p++) land[p] = label[p] === best ? 1 : 0;

  /* ---- 1b. fill interior holes (roads, labels, blips sit on the land) ---- */
  const outside = new Uint8Array(W * H);
  let sp = 0;
  const pushIfOpen = (p) => { if (!land[p] && !outside[p]) { outside[p] = 1; stack[sp++] = p; } };
  for (let x = 0; x < W; x++) { pushIfOpen(x); pushIfOpen((H - 1) * W + x); }
  for (let y = 0; y < H; y++) { pushIfOpen(y * W); pushIfOpen(y * W + W - 1); }
  while (sp) {
    const p = stack[--sp];
    const x = p % W, y = (p / W) | 0;
    if (x > 0)     pushIfOpen(p - 1);
    if (x < W - 1) pushIfOpen(p + 1);
    if (y > 0)     pushIfOpen(p - W);
    if (y < H - 1) pushIfOpen(p + W);
  }
  for (let p = 0; p < land.length; p++) if (!outside[p]) land[p] = 1;

  /* ---- 1c. crop to the mask and write alpha ---- */
  let minX = W, minY = H, maxX = -1, maxY = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (land[y * W + x]) {
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
  }
  const cw = maxX - minX + 1, ch = maxY - minY + 1;
  log(`crop: ${cw}x${ch} at ${minX},${minY}`);

  const out = document.createElement('canvas');
  out.width = cw; out.height = ch;
  const octx = out.getContext('2d');
  const odata = octx.createImageData(cw, ch);
  for (let y = 0; y < ch; y++) {
    for (let x = 0; x < cw; x++) {
      const src = ((y + minY) * W + (x + minX)) * 4;
      const dst = (y * cw + x) * 4;
      const on = land[(y + minY) * W + (x + minX)];
      odata.data[dst] = d[src];
      odata.data[dst + 1] = d[src + 1];
      odata.data[dst + 2] = d[src + 2];
      odata.data[dst + 3] = on ? 255 : 0;
    }
  }
  octx.putImageData(odata, 0, 0);

  /* ---- 2. measure the scale bar in the bottom-left ---- */
  let bar = 0, barY = -1, barX = -1;
  for (let y = H - 1; y > H - 120 && y > 0; y--) {
    let run = 0, runStart = -1;
    for (let x = 0; x < Math.min(400, W); x++) {
      if (lum[y * W + x] > 200) { if (run === 0) runStart = x; run++; }
      else { if (run > bar) { bar = run; barY = y; barX = runStart; } run = 0; }
    }
    if (run > bar) { bar = run; barY = y; barX = runStart; }
  }
  const unitsPerPixel = bar > 20 ? METRES / bar : null;
  log(`scale bar: ${bar}px at y=${barY} -> ${unitsPerPixel ? unitsPerPixel.toFixed(3) : '?'} world units/px`);

  report({
    source: { w: W, h: H },
    crop: { x: minX, y: minY, w: cw, h: ch },
    scaleBarPx: bar,
    unitsPerPixel,
    worldSize: unitsPerPixel ? { w: +(cw * unitsPerPixel).toFixed(0), h: +(ch * unitsPerPixel).toFixed(0) } : null,
    png: out.toDataURL('image/png')
  });
}
</script>
